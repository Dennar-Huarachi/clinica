        <circle cx="8" cy="-6" r="5.5" fill="none" stroke="#D97706" stroke-width="1.8" />
        <line x1="13.5" y1="-6" x2="22" y2="-6" stroke="#D97706" stroke-width="1.8" />
        <line x1="18" y1="-6" x2="18" y2="-2" stroke="#D97706" stroke-width="1.8" />
        <line x1="22" y1="-6" x2="22" y2="-2" stroke="#D97706" stroke-width="1.8" />
        <text x="32" y="0" font-size="18" font-weight="bold" fill="#0F4C81">
          + id_rol [PK]
        </text>

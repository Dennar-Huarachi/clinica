    <line x1="1100" y1="270" x2="1580" y2="270" 
          stroke="#234C73" stroke-width="2.4" />

    <!-- Stereotype «table» -->
    <text x="1340" y="226" text-anchor="middle" 
          font-size="16" font-style="italic" fill="#4B6584">
      &#171;table&#187;
    </text>

    <!-- Table Name -->

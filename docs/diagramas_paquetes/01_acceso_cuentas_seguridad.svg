<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" 
     viewBox="0 0 2560 1600" 
     width="2560" 
     height="1600"
     style="background-color: #FFFFFF; font-family: 'Segoe UI', Arial, sans-serif;">

  <defs>
    <pattern id="eaGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.2" fill="#E2E8F0" />
    </pattern>

    <linearGradient id="eaHeaderGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EBF4FA" />
      <stop offset="100%" stop-color="#D3E6F5" />
    </linearGradient>

    <linearGradient id="eaPkgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EFF6FB" />
      <stop offset="100%" stop-color="#DAEAF5" />
    </linearGradient>

    <filter id="eaShadow" x="-2%" y="-2%" width="105%" height="106%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="3" dy="4" stdDeviation="3.5" flood-color="#0F172A" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="2560" height="1600" fill="#FFFFFF" />
  <rect width="2560" height="1600" fill="url(#eaGrid)" opacity="0.6" />

  <!-- Top Header Banner -->
  <g id="header_banner" filter="url(#eaShadow)">
    <rect x="50" y="40" width="2460" height="110" rx="4" fill="#FFFFFF" stroke="#234C73" stroke-width="2" />
    <rect x="50" y="40" width="16" height="110" fill="#234C73" />

    <text x="90" y="86" font-size="28" font-weight="bold" fill="#0A2540" letter-spacing="0.5">
      PAQUETE 01: ACCESO, CUENTAS Y SEGURIDAD — CL&#205;NICA VIDA SALUD
    </text>
    <text x="90" y="122" font-size="16" fill="#4B6584" font-weight="600">
      Roles, Permisos, Asignaci&#243;n Rol-Permiso y Cuentas de Usuarios (Seguridad OWASP)
    </text>

    <!-- Metadata Badges -->
    <g transform="translate(1740, 60)">
      <rect x="0" y="0" width="220" height="70" rx="3" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.2"/>
      <text x="14" y="28" font-size="12" font-weight="bold" fill="#64748B">SISTEMA</text>
      <text x="14" y="54" font-size="16" font-weight="bold" fill="#0F172A">Cl&#237;nica Vida Salud</text>

      <rect x="240" y="0" width="240" height="70" rx="3" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.2"/>
      <text x="254" y="28" font-size="12" font-weight="bold" fill="#64748B">EST&#193;NDAR / FECHA</text>
      <text x="254" y="54" font-size="16" font-weight="bold" fill="#0F172A">Enterprise Architect 2.5</text>

      <rect x="500" y="0" width="250" height="70" rx="3" fill="#EBF3FA" stroke="#234C73" stroke-width="1.2"/>
      <text x="514" y="28" font-size="12" font-weight="bold" fill="#0F4C81">MOTOR BD</text>
      <text x="514" y="54" font-size="16" font-weight="bold" fill="#00264D">PostgreSQL Nativo</text>
    </g>
  </g>

  <!-- Relationships Layer -->
  <g id="relations_layer">
    
  <!-- Relation: roles -> usuarios -->
  <g>
    <path d="M 330 440 L 330 950" fill="none" stroke="#2B547E" 
          stroke-width="2.4" 
          stroke-dasharray="none" 
          stroke-linecap="round" stroke-linejoin="round" />

    <!-- Cardinality From -->
    <text x="344" y="464" font-size="16" font-weight="bold" fill="#0F172A">
      1
    </text>

    <!-- Cardinality To -->
    <text x="344" y="936" font-size="16" font-weight="bold" fill="#0F172A">
      0..*
    </text>

    <!-- Verb Badge -->
    <g transform="translate(259, 680)">
      <rect x="0" y="0" width="142" height="30" rx="4" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.2" />
      <text x="71" y="20" text-anchor="middle" font-size="15" font-weight="600" fill="#1E3A8A">
        asigna rol a
      </text>
    </g>
  </g>


  <!-- Relation: roles -> rol_permiso -->
  <g>
    <path d="M 560 320 L 740 320 L 740 640" fill="none" stroke="#2B547E" 
          stroke-width="2.4" 
          stroke-dasharray="none" 
          stroke-linecap="round" stroke-linejoin="round" />

    <!-- Cardinality From -->
    <text x="576" y="310" font-size="16" font-weight="bold" fill="#0F172A">
      1
    </text>

    <!-- Cardinality To -->
    <text x="754" y="626" font-size="16" font-weight="bold" fill="#0F172A">
      0..*
    </text>

    <!-- Verb Badge -->
    <g transform="translate(702.25, 465)">
      <rect x="0" y="0" width="75.5" height="30" rx="4" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.2" />
      <text x="37.75" y="20" text-anchor="middle" font-size="15" font-weight="600" fill="#1E3A8A">
        posee
      </text>
    </g>
  </g>


  <!-- Relation: permisos -> rol_permiso -->
  <g>
    <path d="M 1100 390 L 920 390 L 920 640" fill="none" stroke="#2B547E" 
          stroke-width="2.4" 
          stroke-dasharray="none" 
          stroke-linecap="round" stroke-linejoin="round" />

    <!-- Cardinality From -->
    <text x="1064" y="380" font-size="16" font-weight="bold" fill="#0F172A">
      1
    </text>

    <!-- Cardinality To -->
    <text x="934" y="626" font-size="16" font-weight="bold" fill="#0F172A">
      0..*
    </text>

    <!-- Verb Badge -->
    <g transform="translate(849, 500)">
      <rect x="0" y="0" width="142" height="30" rx="4" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.2" />
      <text x="71" y="20" text-anchor="middle" font-size="15" font-weight="600" fill="#1E3A8A">
        concedido en
      </text>
    </g>
  </g>


  <!-- Relation: usuarios -> personas -->
  <g>
    <path d="M 620 1100 L 1100 1100" fill="none" stroke="#64748B" 
          stroke-width="2" 
          stroke-dasharray="6,4" 
          stroke-linecap="round" stroke-linejoin="round" />

    <!-- Cardinality From -->
    <text x="636" y="1090" font-size="16" font-weight="bold" fill="#0F172A">
      0..1
    </text>

    <!-- Cardinality To -->
    <text x="1060" y="1090" font-size="16" font-weight="bold" fill="#0F172A">
      1
    </text>

    <!-- Verb Badge -->
    <g transform="translate(793.75, 1085)">
      <rect x="0" y="0" width="132.5" height="30" rx="4" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.2" />
      <text x="66.25" y="20" text-anchor="middle" font-size="15" font-weight="600" fill="#1E3A8A">
        accede como
      </text>
    </g>
  </g>

  </g>

  <!-- Classes Layer -->
  <g id="classes_layer" filter="url(#eaShadow)">
    
  <!-- Class: roles -->
  <g id="table_roles">
    <!-- Class Outer Box -->
    <rect x="100" y="200" width="460" height="264" 
          fill="#FFFFFF" stroke="#234C73" stroke-width="2.4" rx="3" />

    <!-- Class Header Compartment -->
    <rect x="100" y="200" width="460" height="70" 
          fill="url(#eaHeaderGrad)" rx="3" />
    <line x1="100" y1="270" x2="560" y2="270" 
          stroke="#234C73" stroke-width="2.4" />

    <!-- Stereotype «table» -->
    <text x="330" y="226" text-anchor="middle" 
          font-size="16" font-style="italic" fill="#4B6584">
      &#171;table&#187;

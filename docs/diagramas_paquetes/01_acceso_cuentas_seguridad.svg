      <line x1="116" y1="1064" x2="604" y2="1064" 
            stroke="#A5C4DF" stroke-width="1.2" stroke-dasharray="3,3" />
      <text x="132" y="1082" font-size="17" fill="#1F2937">
        nombre_usuario
      </text>
      <text x="132" y="1116" font-size="17" fill="#1F2937">
        correo
      </text>
      <text x="132" y="1150" font-size="17" fill="#1F2937">
        contrasena_hash
      </text>
      <text x="132" y="1184" font-size="17" fill="#1F2937">
        debe_cambiar_contrasena
      </text>
      <text x="132" y="1218" font-size="17" fill="#1F2937">
        estado
      </text>
      <text x="132" y="1252" font-size="17" fill="#1F2937">
        ultimo_acceso
      </text>
      <text x="132" y="1286" font-size="17" fill="#1F2937">
        token_sesion
      </text>
      <text x="132" y="1320" font-size="17" fill="#1F2937">
        created_at
      </text>
      <text x="132" y="1354" font-size="17" fill="#1F2937">
        updated_at
      </text>
    </g>
  </g>

  </g>

  <!-- External Classes Layer -->
  <g id="externals_layer">
    
  <!-- External Class Reference: personas -->
  <g id="ext_personas">
    <rect x="1100" y="1050" width="420" height="95" 
          fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.8" stroke-dasharray="6,4" rx="4" />
    <text x="1310" y="1076" text-anchor="middle" font-size="13" font-style="italic" fill="#64748B">
      &#171;external table&#187;
    </text>
    <text x="1310" y="1102" text-anchor="middle" font-size="18" font-weight="bold" fill="#334155">
      personas
    </text>
    <text x="1310" y="1124" text-anchor="middle" font-size="13" fill="#64748B">
      Paquete: Pacientes y Perfil
    </text>
  </g>

  </g>

  <!-- Legend Box -->
  <g id="legend_box" transform="translate(1800, 1180)" filter="url(#eaShadow)">
    <rect x="0" y="0" width="640" height="320" rx="4" fill="#FFFFFF" stroke="#234C73" stroke-width="2" />
    <rect x="0" y="0" width="640" height="42" fill="url(#eaHeaderGrad)" rx="4" />
    <text x="18" y="28" font-size="16" font-weight="bold" fill="#00264D">CONVENCIONES UML ENTERPRISE ARCHITECT</text>

    <g transform="translate(20, 68)">
      <circle cx="10" cy="-6" r="6" fill="none" stroke="#D97706" stroke-width="2" />
      <line x1="16" y1="-6" x2="26" y2="-6" stroke="#D97706" stroke-width="2" />
      <text x="36" y="0" font-size="16" font-weight="bold" fill="#0F4C81">+ id_columna [PK]</text>
      <text x="36" y="24" font-size="13.5" fill="#64748B">Clave Primaria f&#237;sica de la tabla</text>

      <text x="36" y="64" font-size="16" fill="#1F2937">nombre_columna</text>
      <text x="36" y="88" font-size="13.5" fill="#64748B">Atributo propio (sin tipos ni llaves for&#225;neas)</text>

      <line x1="0" y1="130" x2="60" y2="130" stroke="#2B547E" stroke-width="2.6" />
      <text x="74" y="136" font-size="15" font-weight="bold" fill="#0F172A">1 &#8226;&#8226; [verbo] &#8226;&#8226; 0..*</text>
      <text x="0" y="162" font-size="13.5" fill="#64748B">Asociaci&#243;n relacional con multiplicidad</text>

      <rect x="0" y="185" width="600" height="52" rx="3" fill="#F8FAFC" stroke="#E2E8F0" />
      <text x="14" y="208" font-size="14" font-weight="bold" fill="#0369A1">REGLA PURA DE MODELADO UML:</text>
      <text x="14" y="228" font-size="13.5" fill="#475569">Las llaves for&#225;neas no se listan en atributos; se expresan por asociaciones.</text>
    </g>
  </g>
</svg>

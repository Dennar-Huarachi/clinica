        </text>
      </g>
      <line x1="1116" y1="314" x2="1564" y2="314" 
            stroke="#A5C4DF" stroke-width="1.2" stroke-dasharray="3,3" />
      <text x="1132" y="332" font-size="17" fill="#1F2937">
        modulo
      </text>
      <text x="1132" y="366" font-size="17" fill="#1F2937">
        nombre
      </text>
      <text x="1132" y="400" font-size="17" fill="#1F2937">
        slug
      </text>
      <text x="1132" y="434" font-size="17" fill="#1F2937">
        descripcion
      </text>
      <text x="1132" y="468" font-size="17" fill="#1F2937">
        created_at
      </text>
      <text x="1132" y="502" font-size="17" fill="#1F2937">
        updated_at
      </text>
    </g>
  </g>


  <!-- Class: rol_permiso -->
  <g id="table_rol_permiso">
    <!-- Class Outer Box -->
    <rect x="620" y="640" width="420" height="196" 
          fill="#FFFFFF" stroke="#234C73" stroke-width="2.4" rx="3" />

    <!-- Class Header Compartment -->
    <rect x="620" y="640" width="420" height="70" 
          fill="url(#eaHeaderGrad)" rx="3" />
    <line x1="620" y1="710" x2="1040" y2="710" 
          stroke="#234C73" stroke-width="2.4" />

    <!-- Stereotype «table» -->
    <text x="830" y="666" text-anchor="middle" 
          font-size="16" font-style="italic" fill="#4B6584">
      &#171;table&#187;
    </text>

    <!-- Table Name -->
    <text x="830" y="694" text-anchor="middle" 
          font-size="21" font-weight="bold" fill="#00264D" letter-spacing="0.4">
      rol_permiso
    </text>

    <!-- Attributes Compartment -->
    <g id="attrs_rol_permiso">
      <g transform="translate(638, 738)">
        <circle cx="8" cy="-6" r="5.5" fill="none" stroke="#D97706" stroke-width="1.8" />
        <line x1="13.5" y1="-6" x2="22" y2="-6" stroke="#D97706" stroke-width="1.8" />
        <line x1="18" y1="-6" x2="18" y2="-2" stroke="#D97706" stroke-width="1.8" />
        <line x1="22" y1="-6" x2="22" y2="-2" stroke="#D97706" stroke-width="1.8" />
        <text x="32" y="0" font-size="18" font-weight="bold" fill="#0F4C81">
          + id_rol, id_permiso [PK]
        </text>
      </g>
      <line x1="636" y1="754" x2="1024" y2="754" 
            stroke="#A5C4DF" stroke-width="1.2" stroke-dasharray="3,3" />
      <text x="652" y="772" font-size="17" fill="#1F2937">
        created_at
      </text>
      <text x="652" y="806" font-size="17" fill="#1F2937">
        updated_at
      </text>
    </g>
  </g>


  <!-- Class: usuarios -->
  <g id="table_usuarios">
    <!-- Class Outer Box -->
    <rect x="100" y="950" width="520" height="434" 
          fill="#FFFFFF" stroke="#234C73" stroke-width="2.4" rx="3" />

    <!-- Class Header Compartment -->
    <rect x="100" y="950" width="520" height="70" 
          fill="url(#eaHeaderGrad)" rx="3" />
    <line x1="100" y1="1020" x2="620" y2="1020" 
          stroke="#234C73" stroke-width="2.4" />

    <!-- Stereotype «table» -->
    <text x="360" y="976" text-anchor="middle" 
          font-size="16" font-style="italic" fill="#4B6584">

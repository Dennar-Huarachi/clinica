      <line x1="116" y1="314" x2="544" y2="314" 
            stroke="#A5C4DF" stroke-width="1.2" stroke-dasharray="3,3" />
      <text x="132" y="332" font-size="17" fill="#1F2937">
        nombre
      </text>
      <text x="132" y="366" font-size="17" fill="#1F2937">
        descripcion
      </text>
      <text x="132" y="400" font-size="17" fill="#1F2937">
        created_at
      </text>
      <text x="132" y="434" font-size="17" fill="#1F2937">
        updated_at
      </text>
    </g>
  </g>


  <!-- Class: permisos -->
  <g id="table_permisos">
    <!-- Class Outer Box -->
    <rect x="1100" y="200" width="480" height="332" 
          fill="#FFFFFF" stroke="#234C73" stroke-width="2.4" rx="3" />

